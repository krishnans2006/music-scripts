directory: SCRIPT_DIR/final
library: SCRIPT_DIR/beets-library.db
plugins: chroma musicbrainz lyrics fetchart smartplaylist inline

acoustid:
  apikey: ACOUSTID_API_KEY

import:
  autotag: yes
  move: yes
  write: yes
  incremental: yes
  incremental_skip_later: yes
  from_scratch: yes
  bell: yes

match:
  # Experimentally, strong matches seem to have a score of 88.9%
  # and less strong matches have lower scores, so strong_rec_thresh is
  # changed from the default (0.04 => 96%) to 0.12 => 88%
  # The medium_rec_thresh is unchanged from the default (0.25 => 75%)
  strong_rec_thresh: 0.12

paths:
  default: $albumartist/$album/$track - $title

lyrics:
  auto: yes
  fallback: ""
  synced: yes

smartplaylist:
  playlist_dir: ./final
  playlists:
    - name: Liked_Music.m3u
      query: 'playlist_source:"Liked Music" id+'
