directory: SCRIPT_DIR/final
library: SCRIPT_DIR/beets-library.db
plugins: chroma musicbrainz lyrics fetchart smartplaylist inline

acoustid:
  apikey: ACOUSTID_API_KEY

import:
  autotag: yes
  move: yes
  write: yes
  from_scratch: yes
  quiet: yes
  quiet_fallback: asis
  # Keep separate records while the path template groups matching albums.
  # Merging can reuse staging paths after their files have already moved.
  duplicate_action: keep

match:
  # We want as-is for everything, so strong threshold is 0
  # Strong means it bypasses the prompt and always re-tags
  strong_rec_thresh: 0

paths:
  default: $albumartist/$album/$track - $title

lyrics:
  # Fetch after importing so album merges are fully committed first
  auto: no
  fallback: ""
  synced: yes
  sources: [lrclib, genius]

smartplaylist:
  playlist_dir: ./final
  playlists:
    - name: Liked_Music.m3u
      query: 'playlist_source:"Liked Music" id+'
