directory: SCRIPT_DIR/final
library: SCRIPT_DIR/beets-library.db
pluginpath:
  - SCRIPT_DIR/plugins
plugins: musicbrainz lyrics navidrome smartplaylist replaygain chroma lastgenre

import:
  autotag: yes
  move: yes
  write: yes
  from_scratch: no
  quiet: yes
  quiet_fallback: asis
  duplicate_action: skip
  singletons: yes

chroma:
  auto: yes

lastgenre:
  auto: yes
  source: track
  force: yes
  canonical: yes
  fallback: 'Music'
  count: 1

lyrics:
  auto: yes
  synced: yes
  sources: [lrclib]

replaygain:
  auto: no
  backend: ffmpeg
  targetlevel: 89

match:
  strong_rec_thresh: 0.25
  medium_rec_thresh: 0.32
  rec_gap_thresh: 0.15
  distance_weights:
    track_index: 0.0
    track_length: 2.0
    track_title: 3.0
    track_artist: 2.0
  track_length_grace: 10
  track_length_max: 30

paths:
  default: ${track_prefix} - $artist - $title
  singleton: ${track_prefix} - $artist - $title

smartplaylist:
  playlist_dir: SCRIPT_DIR/final
  relative_to: SCRIPT_DIR/final
  output: extm3u
  auto: yes
  playlists:
    - name: 'Liked Music.m3u8'
      query: 'track+'
